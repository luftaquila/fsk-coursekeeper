name: Course

on:
  push:
    branches: [main]
    paths:
      - 'course/**'
      - 'console/**'
      - 'tests/course/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/course.yml'
  pull_request:
    paths:
      - 'course/**'
      - 'console/**'
      - 'tests/course/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/course.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build the standalone console
        run: pnpm --filter fsk-coursekeeper-console build
