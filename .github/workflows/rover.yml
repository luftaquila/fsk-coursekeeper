name: Rover

# Branch pushes test and build every changed component without publishing.
# A release (release.yml, on a v* tag) builds them all and publishes the images
# as :vX.Y.Z and :latest; a manual run publishes the chosen component's images
# as :edge-<sha> for testing on a device.
on:
  push:
    branches: [main]
    paths:
      - 'rover/**'
      - 'scripts/package-devices.sh'
      - 'tests/hub/**'
      - 'tests/rover/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/rover.yml'
  workflow_call:
  workflow_dispatch:
    inputs:
      component:
        description: 'Rover component to build (hub and pilot publish :edge-<sha> images).'
        required: true
        type: choice
        options:
          - pilot
          - hub
          - mcu
          - gps
          - installers

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gps: ${{ steps.release.outputs.all || steps.filter.outputs.gps }}
      hub: ${{ steps.release.outputs.all || steps.filter.outputs.hub }}
      installers: ${{ steps.release.outputs.all || steps.filter.outputs.installers }}
      mcu: ${{ steps.release.outputs.all || steps.filter.outputs.mcu }}
      pilot: ${{ steps.release.outputs.all || steps.filter.outputs.pilot }}
    steps:
      - uses: actions/checkout@v6

      # A release builds every component.
      - id: release
        if: github.ref_type == 'tag'
        run: echo "all=true" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push' && github.ref_type != 'tag'
        with:
          filters: |
            gps:
              - 'rover/gps/**'
              - 'rover/pilot/pilot/lib/**'
              - '.github/workflows/rover.yml'
            hub:
              - 'rover/hub/**'
              - 'tests/hub/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/rover.yml'
            installers:
              - 'rover/common/**'
              - 'rover/host/**'
              - 'rover/gps/**'
              - 'rover/pilot/pilot/lib/**'
              - 'scripts/package-devices.sh'
              - 'tests/rover/**'
              - '.github/workflows/rover.yml'
            mcu:
              - 'rover/mcu/**'
              - '.github/workflows/rover.yml'
            pilot:
              - 'rover/pilot/**'
              - '.github/workflows/rover.yml'

  gps:
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.component == 'gps') ||
      needs.changes.outputs.gps == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: rover-gps-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pip install -r rover/gps/requirements.txt

      - name: Compile agent sources
        run: python3 -m compileall rover/gps/*.py rover/gps/test

      - name: Run gps pytest
        run: |
          cd rover/gps
          python3 -m pytest test/ -q

  hub-verify:
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.component == 'hub') ||
      needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: rover-hub-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run hub tests
        run: node --test --test-concurrency=2 'tests/hub/*.test.mjs'

  hub:
    needs: [changes, hub-verify]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.component == 'hub') ||
      needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    concurrency:
      group: rover-hub-image-${{ github.ref }}
      cancel-in-progress: true
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fsk-coursekeeper-rover-hub
      PUBLISH: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version and tags
        id: tags
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:${GITHUB_REF_NAME},$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build hub image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: rover/hub/Containerfile
          platforms: linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=rover-hub
          cache-to: type=gha,scope=rover-hub,mode=max

  installers:
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.component == 'installers') ||
      needs.changes.outputs.installers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check
        run: |
          shellcheck -s bash rover/host/install.sh rover/gps/host/install.sh \
            rover/common/files/usr/local/bin/* rover/host/files/usr/local/bin/pilot-run \
            rover/host/files/usr/local/bin/hub-run rover/host/files/usr/local/bin/pid-tune
          shellcheck -s sh scripts/package-devices.sh rover/host/files/usr/local/bin/flash-mcu \
            rover/host/files/etc/NetworkManager/dispatcher.d/*
          node --test 'tests/rover/*.test.mjs'

      # The installers install this version's images: a release's tag, or on a
      # branch the :edge-<sha> images a manual run would publish.
      - name: Package
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then version="${GITHUB_REF_NAME}"; else version="edge-${GITHUB_SHA::7}"; fi
          scripts/package-devices.sh "${GITHUB_REPOSITORY}" "$version" .tmp/device-installers

      - uses: actions/upload-artifact@v7
        with:
          name: device-installers
          path: .tmp/device-installers
          if-no-files-found: error

  mcu:
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.component == 'mcu') ||
      needs.changes.outputs.mcu == 'true'
    runs-on: ubuntu-24.04
    env:
      PICO_SDK_REF: '2.1.1'
      PICO_BOARD: 'pico'
    steps:
      - uses: actions/checkout@v6

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            python3 \
            build-essential \
            git

      - name: Cache pico-sdk
        id: cache-sdk
        uses: actions/cache@v5
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_REF }}

      - name: Clone pico-sdk
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${PICO_SDK_REF} \
            https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --depth 1 \
            lib/tinyusb lib/cyw43-driver lib/lwip lib/btstack lib/mbedtls

      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -G Ninja \
            -S rover/mcu \
            -B rover/mcu/build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPICO_BOARD=${PICO_BOARD}

      - name: Build
        run: cmake --build rover/mcu/build --parallel

      - name: Verify firmware artifacts
        run: |
          ls -la rover/mcu/build/fsk-coursekeeper-rover-mcu.uf2
          ls -la rover/mcu/build/fsk-coursekeeper-rover-mcu.elf
          arm-none-eabi-size rover/mcu/build/fsk-coursekeeper-rover-mcu.elf

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: fsk-coursekeeper-rover-mcu
          path: |
            rover/mcu/build/fsk-coursekeeper-rover-mcu.uf2
            rover/mcu/build/fsk-coursekeeper-rover-mcu.elf
            rover/mcu/build/fsk-coursekeeper-rover-mcu.bin
          if-no-files-found: error

  pilot-verify:
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.component == 'pilot') ||
      needs.changes.outputs.pilot == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: rover-pilot-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python test deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pip install -r rover/pilot/requirements.txt || true

      - name: Compile rover sources
        run: python3 -m compileall rover/pilot/pilot rover/pilot/test rover/pilot/launch

      - name: Run pilot pytest
        run: |
          cd rover/pilot
          python3 -m pytest test/ -q

  pilot:
    needs: [changes, pilot-verify]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.component == 'pilot') ||
      needs.changes.outputs.pilot == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    concurrency:
      group: rover-pilot-image-${{ github.ref }}
      cancel-in-progress: true
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fsk-coursekeeper-rover-pilot
      PUBLISH: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version and tags
        id: tags
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:${GITHUB_REF_NAME},$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build pilot image
        uses: docker/build-push-action@v7
        with:
          context: rover/pilot
          file: rover/pilot/Containerfile
          platforms: linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=rover-pilot
          cache-to: type=gha,scope=rover-pilot,mode=max
