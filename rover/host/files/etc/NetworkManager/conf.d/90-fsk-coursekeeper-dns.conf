# Keep DHCP for the rover's address, gateway, and routes, but make the host's
# resolvers deterministic on every connection, so public names (ghcr.io, the
# time servers) still resolve when the AP supplies no usable DNS server.
# Tailscale leaves the host's DNS alone (the installer sets --accept-dns=false).
[global-dns-domain-*]
servers=1.1.1.1,8.8.8.8
