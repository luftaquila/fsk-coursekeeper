# Rover state on the host, created at boot so it exists before the services start.
# /var/lib/pilot: the pilot container's calibration files and mission checkpoint.
# /var/lib/fsk-coursekeeper-hub: the hub's SQLite database (mission ledger, logs).
# /etc/fsk-coursekeeper: the installed release and its images (written by the installer).
d /var/lib/pilot                  0755 root root - -
d /var/lib/fsk-coursekeeper-hub   0755 root root - -
d /etc/fsk-coursekeeper           0755 root root - -
